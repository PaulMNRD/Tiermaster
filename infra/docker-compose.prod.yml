# Production stack on a single VPS (ADR 0005). Secrets live in .env next to this file (see infra/README.md).
name: tiermaster

services:
  web:
    image: ${IMAGE_PREFIX}/tiermaster-web:${TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    image: ${IMAGE_PREFIX}/tiermaster-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tiermaster:${POSTGRES_PASSWORD}@postgres:5432/tiermaster
      PUBLIC_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_SECURE: "true"
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://garage:3900
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET: tiermaster-images
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_started

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tiermaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tiermaster
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiermaster"]
      interval: 5s
      retries: 20

  garage:
    image: dxflrs/garage:v2.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  garage-data:
